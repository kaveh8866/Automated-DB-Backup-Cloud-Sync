# =============================================================================
# Automated DB Backup & Cloud Sync — schedule & retention defaults
# =============================================================================
# Sourced by scripts/entrypoint.sh at container start. Every line only fills a
# value that is still unset, so an environment variable (or `.env`) always wins
# over this file. Edit this file to change the baseline policy for every host.

# One backup cycle every hour. Lower it for demos: 60 = one per minute.
: "${BACKUP_INTERVAL_SECONDS:=3600}"

# Delete archives older than this many days ...
: "${BACKUP_RETENTION_DAYS:=7}"

# ... but never drop below this many newest archives, even if all are older.
: "${BACKUP_KEEP_MINIMUM:=3}"

# Where archives are written inside the runner container (named volume).
: "${BACKUP_ARCHIVE_DIR:=/backups}"

# local | rclone | off — see scripts/sync.sh.
: "${BACKUP_SYNC_MODE:=local}"

# Mock cloud target used by `local` mode; it lives inside the archive volume so
# it survives container restarts and can be inspected with `docker cp`.
: "${BACKUP_LOCAL_SYNC_DIR:=/backups/mock-cloud-sync}"

# rclone remote name and destination prefix used by `rclone` mode.
: "${RCLONE_REMOTE:=}"
: "${RCLONE_DEST_PATH:=}"

# At-rest encryption of the archive itself (see scripts/backup.sh).
#   off     -> plaintext .tar.gz, checksummed as usual
#   openssl -> AES-256-CBC with pbkdf2, plaintext removed, `.tar.gz.enc` kept
# The passphrase is never stored here: set BACKUP_ENCRYPTION_PASSPHRASE or point
# BACKUP_ENCRYPTION_PASSPHRASE_FILE at a file mounted from outside Git.
: "${BACKUP_ENCRYPTION:=off}"
: "${BACKUP_ENCRYPTION_PASSPHRASE:=}"
: "${BACKUP_ENCRYPTION_PASSPHRASE_FILE:=}"

# Failure notification (see scripts/alert.sh). Empty URL = structured log line
# only, which is already enough for `docker logs` and any log shipper.
: "${ALERT_WEBHOOK_URL:=}"
: "${ALERT_TIMEOUT_SECONDS:=10}"
